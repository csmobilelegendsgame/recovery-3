<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohon pilih masalah yang sedang And...</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #F7F9FA; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; user-select: none; }
        
        /* Header */
        .header { background: #3B66A4; color: white; text-align: center; padding: 15px; font-size: 14px; position: relative; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 40px; padding-right: 40px; }
        .btn-back-top { position: absolute; left: 15px; color: white; text-decoration: none; font-weight: bold; cursor: pointer; }
        
        /* Content (Scrollable if options are long) */
        .content { flex: 1; padding: 16px; overflow-y: auto; }
        
        /* Opsi Pilihan */
        .option-card { background: white; border-radius: 8px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #333; line-height: 1.4; cursor: pointer; border: 1px solid #f0f0f0; }
        .option-card span { padding-right: 12px; }
        .option-card input { width: 18px; height: 18px; flex-shrink: 0; accent-color: #1A8CFF; }
        
        /* Footer Buttons */
        .footer { padding: 16px; background: #F7F9FA; }
        .btn-container { display: flex; gap: 12px; margin-bottom: 15px; }
        
        /* Base Button Style */
        .btn { flex: 1; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 500; cursor: pointer; text-align: center; text-decoration: none; display: block; }
        
        /* Tombol Kembali (Putih) */
        .btn-white { background: white; color: #555; border: 1px solid #EAEAEA; }
        .btn-white:active { background: #F0F2F3; }
        
        /* Tombol Berikutnya (Biru) */
        .btn-blue { background: #1A8CFF; color: white; }
        .btn-blue:active { background: #0073E6; }
        
        .wm { text-align: center; font-size: 10px; color: #AAA; }
    </style>
</head>
<body>

    <div class="header">
        <!-- Panah atas kembali ke repo 2 -->
        <span class="btn-back-top" onclick="kembaliLink()">&#10094;</span>
        Mohon pilih masalah yang sedang Anda hadapi...
    </div>

    <div class="content">
        <label class="option-card">
            <span>Saya lupa akun saya.</span>
            <input type="radio" name="masalah" value="lupa_akun">
        </label>

        <label class="option-card">
            <span>Saya lupa kata sandi saya.</span>
            <input type="radio" name="masalah" value="lupa_sandi">
        </label>

        <label class="option-card">
            <span>Saya belum menghubungkan akun apa pun dan tidak bisa login.</span>
            <input type="radio" name="masalah" value="belum_hubung">
        </label>

        <label class="option-card">
            <span>Orang lain mengakses akun saya / diretas.</span>
            <input type="radio" name="masalah" value="diretas">
        </label>

        <label class="option-card">
            <span>Saya tidak bisa login menggunakan akun pihak ketiga saya.</span>
            <input type="radio" name="masalah" value="pihak_ketiga">
        </label>

        <label class="option-card">
            <span>Saya tidak bisa menggunakan alamat email saya.</span>
            <!-- Atribut checked sudah dihapus agar default-nya kosong -->
            <input type="radio" name="masalah" value="kendala_email">
        </label>

        <label class="option-card">
            <span>Saya tidak bisa menggunakan nomor HP saya yang terkait.</span>
            <input type="radio" name="masalah" value="kendala_hp">
        </label>

        <label class="option-card">
            <span>Akun saya login di perangkat lain.</span>
            <input type="radio" name="masalah" value="perangkat_lain">
        </label>
    </div>

    <div class="footer">
        <div class="btn-container">
            <!-- Tombol Kembali Ke Repo 2 -->
            <button type="button" class="btn btn-white" onclick="kembaliLink()">Kembali</button>
            
            <!-- Tombol Berikutnya Ke Repo 4 menggunakan tag <a> murni agar pasti berfungsi -->
            <a href="https://csmobilelegendsgame.github.io/recovery-4/" class="btn btn-blue">Berikutnya</a>
        </div>
        <div class="wm">Powered by AIHELP.NET</div>
    </div>

    <script>
        // MENUJU KE REPO 2 (Halaman Sebelumnya)
        function kembaliLink() {
            window.location.replace("https://csmobilelegendsgame.github.io/recovery-2/");
        }
    </script>

</body>
</html>
